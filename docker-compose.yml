name: weather-alerts

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://weather:weather@db:5432/weather
  # Fine for running it locally; any real deployment needs its own long random secret.
  JWT_SECRET: ${JWT_SECRET:-local-compose-secret-not-for-production}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather
      POSTGRES_DB: weather
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: .
    command: alembic upgrade head
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment: *app-environment
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
